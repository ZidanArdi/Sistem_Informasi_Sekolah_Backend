host: 127.0.0.1:3000
info:
  contact:
    email: praktikum@example.com
    name: Praktikum Pemrograman III
  description: Dokumentasi API backend Sistem Informasi Sekolah menggunakan Golang
    Fiber, GORM, PostgreSQL, dan JWT.
  title: API Sistem Informasi Sekolah
  version: "1.0"
paths:
  /api/absensi/:
    get:
      consumes:
      - application/json
      description: Mengambil seluruh data absensi. Dapat disaring berdasarkan kelas,
        tanggal, status persetujuan, dan siswa. Route ini terproteksi jika diakses
        via route ber-auth, namun absensiRoute juga didaftarkan sebagai publicAPI
        di main.go.
      parameters:
      - description: Filter ID Kelas
        in: query
        name: kelas_id
        type: string
      - description: Filter Tanggal (YYYY-MM-DD)
        in: query
        name: tanggal
        type: string
      - description: Filter Status Persetujuan (e.g. Pending/Disetujui/Ditolak)
        in: query
        name: status_persetujuan
        type: string
      - description: Filter ID Siswa
        in: query
        name: siswa_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.AbsensiResponseList'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.SwaggerError500Response'
      summary: Ambil semua data absensi
      tags:
      - Absensi
    post:
      consumes:
      - application/json
      description: Menambahkan data absensi baru atau mengajukan izin.
      parameters:
      - description: Payload data absensi
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.Absensi'
      produces:
      - application/json
      responses:
        "201":
